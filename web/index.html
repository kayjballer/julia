<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Julia</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#070403;color:#f3e3c3;font-family:system-ui,sans-serif;overflow:hidden;user-select:none}
#app{position:fixed;inset:0}
canvas#c{position:absolute;inset:0;width:100%;height:100%}
.b{background:transparent;border:0.5px solid rgba(255,200,110,.32);color:#f3e3c3;border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer;font-family:inherit}
.b.on{background:rgba(255,180,50,.2);border-color:#f0a830}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block;margin:auto}
.tg{width:40px;height:23px;border-radius:12px;background:rgba(255,255,255,.18);position:relative;cursor:pointer;flex:none}
.tg i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#f3e3c3;transition:left .15s}
.tg.on{background:#d98f1f}.tg.on i{left:20px}
.rw{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:0.5px solid rgba(255,200,110,.16);font-size:15px}
.br{position:absolute;width:16px;height:16px;border:0 solid rgba(240,168,48,.55)}
#top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 0;display:flex;justify-content:center;text-align:center}
#bot{position:absolute;left:0;right:0;bottom:0;padding:0 20px calc(env(safe-area-inset-bottom,0px) + 22px)}
#pn{position:absolute;inset:0;background:rgba(7,4,3,.97);padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 20px;overflow:auto;transform:translateX(100%);transition:transform .25s}
.side{position:absolute;top:calc(env(safe-area-inset-top,0px) + 84px);font-size:11px;line-height:1.6;color:#b39a70}
.side span{color:#f3e3c3;font-size:12px}
@media (prefers-reduced-motion:reduce){#pn,.tg i{transition:none}}
</style></head><body>
<div id="app">
<canvas id="c"></canvas>
<div class="br" style="left:10px;top:10px;border-width:1px 0 0 1px"></div><div class="br" style="right:10px;top:10px;border-width:1px 1px 0 0"></div>
<div class="br" style="left:10px;bottom:10px;border-width:0 0 1px 1px"></div><div class="br" style="right:10px;bottom:10px;border-width:0 1px 1px 0"></div>
<div id="top"><div><div id="ttl" style="font-size:24px;font-weight:700;letter-spacing:.05em;color:#f5b21f">J.U.L.I.A</div><span id="chip" style="display:inline-block;margin-top:6px;font-size:12px;padding:3px 10px;border-radius:10px;border:0.5px solid #f0a830;color:#f0a830">En veille</span></div>
<button id="gear" class="b" aria-label="Paramètres" style="position:absolute;right:20px;top:calc(env(safe-area-inset-top,0px) + 14px);padding:7px 9px"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
<div class="side" style="left:20px">Modèle<br><span id="mdl">Auto</span><br>Mémoire<br><span id="cnt">0 souvenir</span></div>
<div class="side" style="right:20px;text-align:right">Langue<br><span id="lg">Français</span></div>
<div id="bot">
<div style="text-align:center;min-height:78px;max-height:26vh;overflow-y:auto;margin-bottom:6px">
<p id="u" style="margin:0 0 6px;font-size:13px;color:#b39a70;line-height:1.5"></p>
<p id="j" style="margin:0;font-size:16px;line-height:1.5"></p></div>
<div id="kb" style="display:none;gap:8px;margin-bottom:10px"><input id="kin" type="text" enterkeyhint="send" autocomplete="off" placeholder="Écris à Julia…" style="flex:1;min-width:0;background:rgba(255,255,255,.06);color:#f3e3c3;border:0.5px solid rgba(255,200,110,.32);border-radius:10px;padding:10px 12px;font-size:16px;font-family:inherit;-webkit-user-select:text;user-select:text"><button id="ksend" class="b" aria-label="Envoyer" style="padding:0 14px">Envoyer</button></div>
<canvas id="wv" style="width:100%;height:36px;display:block;margin-bottom:14px"></canvas>
<div style="display:flex;justify-content:center;align-items:center;gap:30px">
<button id="brain" class="b" aria-label="Mémoire" style="border-radius:50%;width:46px;height:46px;padding:0"><svg class="ic" viewBox="0 0 24 24"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 2 5 3 3 0 0 0 6 1V5a2 2 0 0 0-3-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 5 3 3 0 0 1-2 5 3 3 0 0 1-6 1"/></svg></button>
<button id="mic" class="b" aria-label="Parler" style="border-radius:50%;width:66px;height:66px;padding:0;border-width:2px;border-color:#f0a830"><svg class="ic" viewBox="0 0 24 24" style="width:28px;height:28px"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
<button id="kbtn" class="b" aria-label="Clavier" style="border-radius:50%;width:46px;height:46px;padding:0"><svg class="ic" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></button></div></div>
<div id="mp" style="position:absolute;inset:0;z-index:2;background:rgba(7,4,3,.97);padding:calc(env(safe-area-inset-top,0px) + 16px) 20px 20px;overflow:auto;transform:translateX(-100%);transition:transform .25s"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:20px;font-weight:500">Mémoire</span><button id="mcl" class="b" aria-label="Fermer" style="padding:7px 9px"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="mlist"></div></div>
<div id="pn">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><span style="font-size:20px;font-weight:500">Paramètres</span><button id="cl" class="b" aria-label="Fermer" style="padding:7px 9px"><svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="rw"><span>Voix de Julia</span><div class="tg" data-k="voice"><i></i></div></div>
<div class="rw"><span>Vitesse de la voix</span><span data-seg="speed"><button class="b" data-v="lente">Lente</button> <button class="b" data-v="normale">Normale</button> <button class="b" data-v="rapide">Rapide</button></span></div>
<div class="rw"><span>Ton de la voix</span><span data-seg="pitch"><button class="b" data-v="grave">Grave</button> <button class="b" data-v="normal">Normal</button> <button class="b" data-v="aigu">Aigu</button></span></div>
<div class="rw"><span>Voix</span><button id="vbtn" class="b">Système</button></div>
<div class="rw"><span>Langue</span><span data-seg="lang"><button class="b" data-v="FR">FR</button> <button class="b" data-v="EN">EN</button> <button class="b" data-v="WO">WO</button></span></div>
<div class="rw"><span>Modèle IA</span><span data-seg="model"><button class="b" data-v="auto">Auto</button> <button class="b" data-v="general">Général</button> <button class="b" data-v="code">Code</button></span></div>
<div class="rw"><span>Accès à Internet</span><div class="tg" data-k="web"><i></i></div></div>
<div class="rw"><span>Sensibilité du micro</span><span data-seg="mic"><button class="b" data-v="bas">Bas</button> <button class="b" data-v="moyen">Moyen</button> <button class="b" data-v="haut">Haut</button></span></div>
<div class="rw"><span>Mémoire automatique</span><div class="tg" data-k="mem"><i></i></div></div>
<div class="rw"><span>Effacer la mémoire</span><button id="wipe" class="b" style="border-color:#e26a6a;color:#f0a0a0">Effacer</button></div>
<div class="rw"><span>Couleur de la sphère</span><span id="sw" style="display:flex;gap:12px"></span></div>
</div></div>
<script>
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),wv=document.getElementById('wv'),wx=wv.getContext('2d');
var W,H,dpr=window.devicePixelRatio||1;
function rs(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);wv.width=wv.clientWidth*dpr;wv.height=36*dpr;wx.setTransform(dpr,0,0,dpr,0,0)}
rs();addEventListener('resize',rs);
var cfg={voice:1,mem:1,speed:'normale',lang:'FR',model:'auto',web:1,mic:'moyen',hue:42,pitch:'normal',vname:''};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('julia_cfg2')||'{}'))}catch(e){}
if(['auto','general','code'].indexOf(cfg.model)<0)cfg.model='auto';
function save(){try{localStorage.setItem('julia_cfg2',JSON.stringify(cfg))}catch(e){}}
var LG={FR:'Français',EN:'English',WO:'Wolof'},MD={auto:'Auto',general:'Général',code:'Code'};
var spoken=0,vlist=[];
var RATE={lente:0.85,normale:1,rapide:1.2},PITCH={grave:0.75,normal:1,aigu:1.3};
function loadVoices(){fetch('/api/voices?lang='+cfg.lang).then(function(r){return r.json()}).then(function(d){vlist=d.voices||[];paint()}).catch(function(){})}
function say(text){if(!text||!cfg.voice)return;fetch('/api/speak',{method:'POST',body:JSON.stringify({text:text,pitch:PITCH[cfg.pitch]||1,rate:RATE[cfg.speed]||1,lang:cfg.lang,voice:cfg.vname})}).catch(function(){})}
function stopSpeech(){fetch('/api/speak/stop',{method:'POST',body:'{}'}).catch(function(){})}

function paint(){
document.querySelectorAll('.tg').forEach(function(e){e.classList.toggle('on',!!cfg[e.dataset.k])});
document.querySelectorAll('[data-seg]').forEach(function(g){g.querySelectorAll('button').forEach(function(b){b.classList.toggle('on',cfg[g.dataset.seg]===b.dataset.v)})});
var vb=document.getElementById('vbtn'),vs=vlist,vi=0;for(var k=0;k<vs.length;k++)if(vs[k].name===cfg.vname)vi=k;
if(vb)vb.textContent=vs.length?('Voix '+(vi+1)+'/'+vs.length):'Système';
document.getElementById('lg').textContent=LG[cfg.lang];document.getElementById('mdl').textContent=MD[cfg.model];
document.querySelectorAll('#sw b').forEach(function(s){s.style.borderColor=+s.dataset.h===cfg.hue?'#fff':'transparent'})}
[[42,'55%'],[200,'55%'],[150,'50%'],[320,'60%']].forEach(function(c){var s=document.createElement('b');s.dataset.h=c[0];s.style.cssText='width:26px;height:26px;border-radius:50%;background:hsl('+c[0]+',85%,'+c[1]+');border:2px solid transparent;cursor:pointer';s.onclick=function(){cfg.hue=c[0];save();paint()};document.getElementById('sw').appendChild(s)});
document.querySelectorAll('.tg').forEach(function(e){e.onclick=function(){cfg[e.dataset.k]=cfg[e.dataset.k]?0:1;save();paint()}});
document.querySelectorAll('[data-seg]').forEach(function(g){g.querySelectorAll('button').forEach(function(b){b.onclick=function(){cfg[g.dataset.seg]=b.dataset.v;save();paint();if(g.dataset.seg==='lang')loadVoices()}})});
var wipe=document.getElementById('wipe'),wt;
wipe.onclick=function(){if(wipe.textContent==='Effacer'){wipe.textContent='Confirmer';wt=setTimeout(function(){wipe.textContent='Effacer'},3000)}else{clearTimeout(wt);wipe.textContent='Effacé';fetch('/api/memory/clear',{method:'POST'}).then(function(){memLoad()}).catch(function(){});setTimeout(function(){wipe.textContent='Effacer'},1500)}};
document.getElementById('gear').onclick=function(){document.getElementById('pn').style.transform='translateX(0)';loadVoices()};
document.getElementById('cl').onclick=function(){document.getElementById('pn').style.transform='translateX(100%)'};
paint();
/* Scène : réseau de points reliés, arcs orbitaux, noyau, poussière */
var N=120,NO=[],ED=[],DU=[],AR=[
{R:1.18,tx:0.3,ty:0.2,sp:0.6,len:4.2,ph:0},{R:1.28,tx:1.2,ty:1.0,sp:-0.45,len:3.6,ph:2},
{R:1.12,tx:-0.8,ty:0.5,sp:0.8,len:3.0,ph:4},{R:1.35,tx:0.6,ty:-1.1,sp:-0.35,len:4.6,ph:1}];
for(var i=0;i<N;i++){var y=1-2*i/(N-1),r=Math.sqrt(1-y*y),th=i*2.39996,rd=0.9+Math.random()*0.2;NO.push({x:Math.cos(th)*r*rd,y:y*rd,z:Math.sin(th)*r*rd,ph:Math.random()*6.28,sz:0.5+Math.random()*Math.random()*2.4,b:0})}
for(var i=0;i<N;i++)for(var j=i+1;j<N;j++){var dx=NO[i].x-NO[j].x,dy=NO[i].y-NO[j].y,dz=NO[i].z-NO[j].z;if(dx*dx+dy*dy+dz*dz<0.25&&ED.length<340)ED.push([i,j])}
for(var i=0;i<70;i++){var u=Math.random()*2-1,a=Math.random()*6.2832,r=1.5+Math.random()*1.4,q=Math.sqrt(1-u*u);DU.push({x:Math.cos(a)*q*r,y:u*r,z:Math.sin(a)*q*r,ph:Math.random()*6.28})}
var T={rest:{o:0,c:'En veille'},listen:{o:8,c:'Écoute'},think:{o:-12,c:'Réflexion'},speak:{o:4,c:'Réponse'}};
var state='rest',cur=42,resp=0,px=null,py=null,t=0,ay=0,tc=0,extAmp=null,tmr=[],sx0=0,sy0=0;
var chip=document.getElementById('chip'),mic=document.getElementById('mic'),uu=document.getElementById('u'),jj=document.getElementById('j');
var ttl=document.getElementById('ttl');
function setState(s){state=s;tc=0;chip.textContent=T[s].c;if(s==='speak')resp=1}
function typeInto(el,str){var k=0,id=setInterval(function(){k++;el.textContent=str.slice(0,k);if(k>=str.length)clearInterval(id)},28);tmr.push(id)}
function clearTimers(){tmr.forEach(function(x){clearTimeout(x);clearInterval(x)});tmr=[]}
function demo(){clearTimers();uu.textContent='';jj.textContent='';jj.style.color='#f3e3c3';setState('listen');typeInto(uu,'Quelle est la météo demain à Dakar ?');
tmr.push(setTimeout(function(){setState('think');jj.textContent='Julia réfléchit…'},4200));
tmr.push(setTimeout(function(){setState('speak');jj.textContent='';typeInto(jj,'Demain à Dakar : 31 °C, ciel dégagé, brise légère.')},6800));
tmr.push(setTimeout(function(){setState('rest')},12500))}
window.julia={setState:setState,setAmp:function(a){extAmp=a},setUser:function(s){uu.textContent=s},setReply:function(s){jj.textContent=s},respond:function(){resp=1},demo:demo,config:cfg};
function fail(m){setState('rest');jj.style.color='#e0a070';jj.textContent='Erreur : '+m}
function askBrain(text){
spoken=0;stopSpeech();
fetch('/api/ask',{method:'POST',body:JSON.stringify({text:text,lang:cfg.lang,voice:0,mem:cfg.mem,web:cfg.web,model:cfg.model})}).then(function(r){return r.json()}).then(function(){genPoll(0,false)}).catch(function(){fail('réponse indisponible')})}
function speakable(t){return t.replace(/```[\s\S]*?(```|$)/g,' (le code est à l\'écran) ')}
function genPoll(n,started){
fetch('/api/gen').then(function(r){return r.json()}).then(function(g){
if(g.model)document.getElementById('mdl').textContent=g.model==='code'?'Code':'Général';
if(g.stage==='search'&&!started)jj.textContent='Julia cherche sur Internet…';
if(g.text&&!started){setState('speak');started=true}
if(started){var ex='';if(g.done){if(g.web_status==='ok'&&g.sources&&g.sources.length)ex+='\n— '+g.sources[0];else if(g.web_status==='stale')ex+='\n(information enregistrée, non vérifiée)';else if(g.web_status==='fail'&&g.web_error)ex+='\n(Internet indisponible : '+g.web_error+')'}
jj.style.whiteSpace='pre-line';jj.textContent=g.text+(g.done&&g.truncated?' … dis « continue »':'')+ex;jj.parentNode.scrollTop=jj.parentNode.scrollHeight}
if(cfg.voice){
var sp=speakable(g.text),rest=sp.slice(spoken),re=/[^.!?…\n]*[.!?…\n]+\s*/g,m;
while((m=re.exec(rest))&&m[0].trim().length>2){say(m[0].trim());spoken+=m[0].length}
}
if(!g.done&&n<900){tmr.push(setTimeout(function(){genPoll(n+1,started)},200));return}
if(!started){setState('speak');jj.textContent=g.text||'…'}
if(cfg.voice){var sp2=speakable(g.text),r2=sp2.slice(spoken).trim();if(r2)say(r2);spoken=sp2.length}
memLoad();
tmr.push(setTimeout(function(){setState('rest')},Math.max(2500,g.text.length*70)))
}).catch(function(){fail('réponse indisponible')})}
function startListen(){
if(state!=='rest')return;
clearTimers();uu.textContent='';jj.textContent='';jj.style.color='#f3e3c3';
var lang={FR:'fr-FR',EN:'en-US',WO:'fr-FR'}[cfg.lang];
fetch('/api/listen?lang='+lang).then(function(r){return r.json()}).then(function(d){
if(!d.ok){fail(d.error);return}
setState('listen');poll(0)
}).catch(function(){demo()})}
function poll(n){
fetch('/api/stt').then(function(r){return r.json()}).then(function(d){
if(d.partial)uu.textContent=d.partial;
if(d.listening&&n<60){tmr.push(setTimeout(function(){poll(n+1)},250));return}
if(d.error&&!d.text){fail(d.error);return}
if(!d.text){fail('rien entendu');return}
uu.textContent=d.text;setState('think');jj.textContent='Julia réfléchit…';
askBrain(d.text)
}).catch(function(){fail('serveur injoignable')})}
mic.onclick=startListen;jj.textContent='Touche la sphère ou le micro pour parler';jj.style.color='#b39a70';
var kb=document.getElementById("kb"),kin=document.getElementById("kin");
document.getElementById("kbtn").onclick=function(){var open=kb.style.display!=="flex";kb.style.display=open?"flex":"none";if(open)kin.focus()};
function sendText(){var v=kin.value.trim();if(!v||state!=="rest")return;kin.value="";kb.style.display="none";kin.blur();clearTimers();uu.textContent=v;jj.style.color="#f3e3c3";jj.textContent="Julia réfléchit…";setState("think");askBrain(v)}
document.getElementById("ksend").onclick=sendText;
loadVoices();setTimeout(loadVoices,4000);
kin.addEventListener("keydown",function(e){if(e.key==="Enter")sendText()});
document.getElementById("vbtn").onclick=function(){if(!vlist.length){this.textContent="Voix système";loadVoices();return}
var i=-1;for(var k=0;k<vlist.length;k++)if(vlist[k]===cfg.vname)i=k;
cfg.vname=vlist[(i+1)%vlist.length];save();paint();stopSpeech();say(cfg.lang==="EN"?"Hi, I am Julia.":"Salut, moi c'est Julia.")};

var mp=document.getElementById("mp"),ml=document.getElementById("mlist");
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function memLoad(cb){fetch("/api/memory").then(function(r){return r.json()}).then(function(d){var n=d.count;document.getElementById("cnt").textContent=n+" souvenir"+(n>1?"s":"");if(cb)cb(d)}).catch(function(){})}
function memRender(d){
var h="<p style='color:#b39a70;font-size:13px'>Ce que Julia a retenu de toi</p>";
if(!d.facts.length)h+="<p style='font-size:14px'>Rien pour l'instant.</p>";
d.facts.forEach(function(f){h+="<div class='rw'><span>"+esc(f.text)+"</span><button class='b' data-id='"+f.id+"' style='padding:4px 9px'>Suppr.</button></div>"});
h+="<p style='color:#b39a70;font-size:13px;margin-top:18px'>Ce que Julia a appris sur Internet</p>";
if(!d.web||!d.web.length)h+="<p style='font-size:14px'>Rien pour l'instant.</p>";
(d.web||[]).forEach(function(w,i){h+="<div class='rw'><span style='font-size:13px;line-height:1.4'>"+esc(w.title)+"<br><span style='color:#b39a70'>"+esc(w.snippet)+"</span></span><button class='b' data-wi='"+i+"' style='padding:4px 9px;flex:none'>Suppr.</button></div>"});
h+="<p style='color:#b39a70;font-size:13px;margin-top:18px'>Derniers échanges</p>";
if(!d.recent.length)h+="<p style='font-size:14px'>Aucun échange enregistré.</p>";
d.recent.forEach(function(r){h+="<p style='font-size:13px;line-height:1.5;margin:8px 0'><span style='color:#b39a70'>"+(r.role==="user"?"Toi":"Julia")+" :</span> "+esc(r.text)+"</p>"});
ml.innerHTML=h;
ml.querySelectorAll("button[data-id]").forEach(function(b){b.onclick=function(){fetch("/api/memory/delete",{method:"POST",body:JSON.stringify({id:+b.dataset.id})}).then(function(){memLoad(memRender)})}});
ml.querySelectorAll("button[data-wi]").forEach(function(b){b.onclick=function(){fetch("/api/memory/forget",{method:"POST",body:JSON.stringify({q:d.web[+b.dataset.wi].q})}).then(function(){memLoad(memRender)})}})}
document.getElementById("brain").onclick=function(){mp.style.transform="translateX(0)";memLoad(memRender)};
document.getElementById("mcl").onclick=function(){mp.style.transform="translateX(-100%)"};
memLoad();
