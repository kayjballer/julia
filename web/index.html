<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07080d">
<title>Niko</title>
<style>
  :root {
    --nuit: #07080d;
    --texte: #e9e4d8;
    --voix: #ffb36b;
    --discret: #7d8499;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: var(--nuit); overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
  /* le canvas couvre tout l'écran : plus de carré, le halo se fond dans la nuit */
  #orbe { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: var(--nuit); }
  #texte {
    position: fixed; left: 50%; top: 67%; transform: translateX(-50%);
    width: min(86vw, 30em); text-align: center;
    color: var(--texte); font-family: "Iowan Old Style", "Noto Serif", Georgia, serif;
    font-size: 1.28rem; line-height: 1.5; letter-spacing: .005em; pointer-events: none;
  }
  #texte .entendu { display: block; color: var(--discret); font-size: 1rem; font-style: italic; margin-bottom: .5rem; }
  #texte .dit { color: var(--voix); }
  #statut {
    position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 1.1rem);
    text-align: center; font: .86rem/1.3 system-ui, sans-serif; color: var(--discret);
    transition: opacity .6s ease; opacity: 0; pointer-events: none;
  }
  #statut.visible { opacity: 1; }
  #debug {
    display: none; position: fixed; inset: 0; z-index: 10; overflow: auto; padding: 3rem .8rem 1rem;
    background: rgba(7, 8, 13, .94); color: #cfd6e6; font: 11px/1.45 ui-monospace, monospace; white-space: pre-wrap; word-break: break-word;
  }
  #debug.visible { display: block; }
  @media (prefers-reduced-motion: reduce) { #statut { transition: none; } }
</style>
</head>
<body>
<canvas id="orbe"></canvas>
<div id="texte" aria-live="polite"></div>
<div id="statut"></div>
<div id="debug"></div>

<script>
/* ---- Orbe : une sphère éclairée dans un shader, déformée par la voix ---- */
var VERT = 'attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }';
var FRAG = [
'#ifdef GL_FRAGMENT_PRECISION_HIGH',
'precision highp float;',
'#else',
'precision mediump float;',
'#endif',
'uniform vec2 u_c; uniform float u_R; uniform float u_t; uniform float u_energy; uniform float u_calm; uniform vec3 u_col; uniform vec3 u_col2;',
'float h(vec3 p){ p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }',
'float noise(vec3 x){',
'  vec3 i = floor(x); vec3 f = fract(x); f = f * f * (3.0 - 2.0 * f);',
'  return mix(mix(mix(h(i), h(i + vec3(1,0,0)), f.x), mix(h(i + vec3(0,1,0)), h(i + vec3(1,1,0)), f.x), f.y),',
'             mix(mix(h(i + vec3(0,0,1)), h(i + vec3(1,0,1)), f.x), mix(h(i + vec3(0,1,1)), h(i + vec3(1,1,1)), f.x), f.y), f.z);',
'}',
'void main(){',
'  vec2 p = (gl_FragCoord.xy - u_c) / u_R;',
'  float r = length(p);',
'  vec3 bg = vec3(0.0275, 0.0314, 0.0510);',
/* halo : s'éteint avant les bords de l'écran (rayon max 1.64 < 1.66) */
'  float ext = 0.50 + 0.14 * u_energy;',
'  float halo = pow(clamp(1.0 - (max(r, 1.0) - 1.0) / ext, 0.0, 1.0), 2.4) * (0.22 + 0.50 * u_energy + 0.10 * u_calm);',
'  vec3 col = bg + u_col * halo;',
'  float aa = 1.6 / u_R;',
'  float mask = 1.0 - smoothstep(1.0 - aa, 1.0 + aa, r);',
'  if (mask > 0.0) {',
'    float z = sqrt(max(1.0 - r * r, 0.0));',
'    vec3 n = vec3(p, z);',
'    float a = u_t * 0.18;',
'    mat2 rot = mat2(cos(a), -sin(a), sin(a), cos(a));',
'    vec3 q = n; q.xz = rot * q.xz;',
'    float w = noise(q * 2.2 + vec3(0.0, u_t * 0.35, 0.0)) * 0.65 + noise(q * 5.0 - vec3(u_t * 0.5, 0.0, 0.0)) * 0.35;',
'    vec3 nn = normalize(n + (w - 0.5) * (0.28 + 0.9 * u_energy));',
'    float diff = clamp(dot(nn, normalize(vec3(-0.45, 0.55, 0.7))), 0.0, 1.0);',
'    float rim = pow(1.0 - z, 2.4);',
'    float band = smoothstep(0.35, 0.8, w);',
'    vec3 base = mix(u_col2, u_col, band);',
'    vec3 s = base * (0.10 + 0.78 * diff) + u_col * rim * (0.55 + 0.9 * u_energy);',
'    s += pow(diff, 14.0) * 0.28;',
'    col = mix(col, s, mask);',
'  }',
/* léger grain : évite les bandes dans les dégradés sombres */
'  col += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;',
'  gl_FragColor = vec4(col, 1.0);',
'}'
].join('\n');

/* une couleur principale et une secondaire par état ; l'orbe glisse de l'une à l'autre */
var ETATS = {
  demarrage: { c: [0.30, 0.34, 0.47], d: [0.07, 0.08, 0.14], e: 0.05 },
  veille:    { c: [0.36, 0.47, 0.78], d: [0.08, 0.10, 0.22], e: 0.10 },
  ecoute:    { c: [0.36, 0.88, 0.80], d: [0.05, 0.22, 0.24], e: 0.35 },
  reflexion: { c: [0.70, 0.46, 1.00], d: [0.14, 0.07, 0.30], e: 0.45 },
  parle:     { c: [1.00, 0.70, 0.42], d: [0.30, 0.12, 0.08], e: 0.55 }
};

var canvas = document.getElementById('orbe');
var gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
var cur = { c: ETATS.demarrage.c.slice(), d: ETATS.demarrage.d.slice(), e: 0.05, calm: 0 };
var etat = 'demarrage', niveau = 0, eveille = false;
var echelle = 0.75;            /* résolution de rendu : baisse toute seule si l'écran n'atteint pas ~60 images/s */

function shader(type, src) {
  var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null;
}

var U = {};
if (gl) {
  var prog = gl.createProgram();
  var vs = shader(gl.VERTEX_SHADER, VERT), fs = shader(gl.FRAGMENT_SHADER, FRAG);
  if (vs && fs) {
    gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog); gl.useProgram(prog);
    var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    var loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    ['u_c','u_R','u_t','u_energy','u_calm','u_col','u_col2'].forEach(function(k){ U[k] = gl.getUniformLocation(prog, k); });
  } else { gl = null; }
}
var ctx2d = gl ? null : canvas.getContext('2d');

function redimensionner() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w = Math.max(2, Math.round(window.innerWidth * dpr * echelle));
  var h = Math.max(2, Math.round(window.innerHeight * dpr * echelle));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
}
redimensionner();
window.addEventListener('resize', redimensionner);

function mixer(a, b, k) { return a + (b - a) * k; }

var avant = 0, imgs = 0, duree = 0, t0 = 0;

function dessiner(ms) {
  if (!t0) t0 = ms;
  var dt = Math.min(0.05, Math.max(0.001, (ms - (avant || ms)) / 1000)); avant = ms;
  var t = (ms - t0) / 1000, but = ETATS[etat] || ETATS.veille;

  /* lissages indépendants du nombre d'images par seconde */
  var kc = 1 - Math.exp(-dt * 3.5), ke = 1 - Math.exp(-dt * 8), kq = 1 - Math.exp(-dt * 3);
  for (var i = 0; i < 3; i++) { cur.c[i] = mixer(cur.c[i], but.c[i], kc); cur.d[i] = mixer(cur.d[i], but.d[i], kc); }
  var pouls = 0;
  if (etat === 'reflexion') pouls = 0.12 * (0.5 + 0.5 * Math.sin(t * 5));
  if (etat === 'parle') pouls = 0.18 * (0.5 + 0.5 * Math.sin(t * 9)) * (0.5 + niveau);
  var visee = but.e + pouls + (etat === 'ecoute' ? Math.min(niveau * 7, 0.5) : 0) + (etat === 'veille' && eveille ? 0.08 : 0);
  cur.e = mixer(cur.e, visee, ke);
  cur.calm = mixer(cur.calm, eveille ? 1 : 0, kq);

  var w = canvas.width, h = canvas.height;
  var R = Math.min(w, h) * 0.30, cx = w / 2, cy = h * 0.60;      /* cy mesuré depuis le bas : l'orbe est dans le haut de l'écran */
  if (gl) {
    gl.viewport(0, 0, w, h);
    gl.uniform2f(U.u_c, cx, cy); gl.uniform1f(U.u_R, R); gl.uniform1f(U.u_t, t);
    gl.uniform1f(U.u_energy, cur.e); gl.uniform1f(U.u_calm, cur.calm);
    gl.uniform3f(U.u_col, cur.c[0], cur.c[1], cur.c[2]); gl.uniform3f(U.u_col2, cur.d[0], cur.d[1], cur.d[2]);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else if (ctx2d) {
    /* repli sans WebGL : un dégradé radial qui respire */
    var rr = R * (1 + cur.e * 0.12), y = h - cy;
    var g = ctx2d.createRadialGradient(cx - rr * 0.25, y - rr * 0.28, rr * 0.08, cx, y, rr);
    var C = function(v){ return 'rgb(' + Math.round(v[0]*255) + ',' + Math.round(v[1]*255) + ',' + Math.round(v[2]*255) + ')'; };
    g.addColorStop(0, C(cur.c)); g.addColorStop(1, C(cur.d));
    ctx2d.fillStyle = '#07080d'; ctx2d.fillRect(0, 0, w, h);
    ctx2d.beginPath(); ctx2d.arc(cx, y, rr, 0, 6.2832); ctx2d.fillStyle = g; ctx2d.fill();
  }

  /* si on tourne sous ~50 images/s, on réduit un peu la résolution de rendu */
  imgs++; duree += dt;
  if (duree > 1.5) {
    if (imgs / duree < 50 && echelle > 0.5) { echelle = Math.max(0.5, echelle - 0.1); redimensionner(); }
    imgs = 0; duree = 0;
  }
  requestAnimationFrame(dessiner);
}
requestAnimationFrame(dessiner);

/* ---- État venu du service ---- */
var elTexte = document.getElementById('texte'), elStatut = document.getElementById('statut');
var dernier = '';

function esc(s) { return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); }

function appliquer(s) {
  etat = ETATS[s.phase] ? s.phase : 'veille';
  niveau = Math.min(1, Math.max(0, s.level || 0));
  eveille = !!s.awake;
  var sig = (s.heard || '') + '|' + (s.said || '');
  if (sig !== dernier) {
    dernier = sig;
    elTexte.innerHTML = (s.heard ? '<span class="entendu">' + esc(s.heard) + '</span>' : '') + (s.said ? '<span class="dit">' + esc(s.said) + '</span>' : '');
  }
  var msg = '';
  if (etat === 'demarrage') msg = s.status === 'demarrage' ? 'Niko se prépare…' : (s.status || 'Niko se prépare…');
  elStatut.textContent = msg.replace(/_/g, ' ');
  elStatut.classList.toggle('visible', !!msg);
}

function boucle() {
  fetch('/api/state', { cache: 'no-store' }).then(function(r){ return r.json(); }).then(appliquer)
    .catch(function(){ appliquer({ phase: 'demarrage', status: 'connexion à Niko…' }); })
    .then(function(){ setTimeout(boucle, 250); });
}
boucle();

/* ---- Diagnostic : toucher l'écran 3 fois de suite affiche ce que Niko entend et fait ---- */
var elDebug = document.getElementById('debug'), touches = [];
function rafraichirDebug() {
  if (!elDebug.classList.contains('visible')) return;
  fetch('/api/debug', { cache: 'no-store' }).then(function(r){ return r.text(); })
    .then(function(t){ elDebug.textContent = t; })
    .catch(function(){ elDebug.textContent = 'pas de réponse du service'; })
    .then(function(){ setTimeout(rafraichirDebug, 1000); });
}
document.addEventListener('click', function() {
  var n = Date.now();
  touches = touches.filter(function(x){ return n - x < 700; });
  touches.push(n);
  if (touches.length >= 3) {
    touches = [];
    elDebug.classList.toggle('visible');
    rafraichirDebug();
  }
});
</script>
</body>
</html>
