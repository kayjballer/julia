<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importer pour Niko</title>
<style>body{font:16px system-ui,sans-serif;background:#07080d;color:#e9e4d8;padding:1.2rem}button,input{font-size:1rem}button{background:#ffb36b;color:#07080d;border:0;border-radius:1.3rem;padding:.7rem 1.2rem;margin:.6rem 0}li{margin:.3rem 0;word-break:break-all}</style></head>
<body><h2>Importer dans la mémoire de Niko</h2>
<p>Textes (.txt, .md), PDF, photos, vidéos… Les fichiers sont copiés dans Niko.</p>
<input id="f" type="file" multiple><br><button id="go">Envoyer</button><ul id="l"></ul>
<script>
var go=document.getElementById('go'),f=document.getElementById('f'),l=document.getElementById('l');
go.onclick=async function(){
  var fs=Array.from(f.files); if(!fs.length)return;
  go.disabled=true;
  for(var i=0;i<fs.length;i++){
    var li=document.createElement('li'); li.textContent=fs[i].name+' …'; l.appendChild(li);
    try{
      var r=await fetch('/api/upload?name='+encodeURIComponent(fs[i].name),{method:'POST',body:fs[i]});
      li.textContent=fs[i].name+(r.ok?' ✓':' ✗ erreur');
    }catch(e){li.textContent=fs[i].name+' ✗ erreur';}
  }
  go.disabled=false; f.value='';
};
</script></body></html>
